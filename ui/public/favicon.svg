<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Background for high contrast in browser tab bar -->
  <rect width="32" height="32" rx="7" fill="#141414" />
  
  <!-- Outer orbital white ring with precision gap -->
  <circle
    cx="16"
    cy="16"
    r="9.5"
    stroke="#F6F6F6"
    stroke-width="2"
    stroke-linecap="round"
    stroke-dasharray="45 15"
  />
  
  <!-- Inner Spün Amber nucleus dot -->
  <circle
    cx="16"
    cy="16"
    r="2.75"
    fill="#F59E0B"
  />
</svg>
